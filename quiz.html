<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Quiz | AnimeZone</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">
        <a href="index.html" class="logo">AnimeZone</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="#">Anime</a>
            <a href="quiz.html">Quiz</a>
            <a href="#">Popular</a>
        </div>
    </nav>


    <!-- QUIZ -->

    <main class="quiz-container">

        <div class="quiz-header">
            <p class="eyebrow">ANIME CHALLENGE</p>
            <h1>Anime Quiz</h1>
            <p>Think you know anime? Prove it.</p>
        </div>


        <!-- QUIZ BOX -->

        <div id="quiz-box" class="quiz-box">

            <div class="quiz-top">

                <span id="question-number">
                    Question 1 / 10
                </span>

                <span id="score">
                    Score: 0
                </span>

            </div>


            <div class="progress-container">
                <div id="progress"></div>
            </div>


            <h2 id="question">
                Question goes here
            </h2>


            <div id="answers" class="answers">
                <!-- Answers generated by JavaScript -->
            </div>


            <button id="next-button" class="next-button" disabled>
                Next Question →
            </button>

        </div>


        <!-- RESULT -->

        <div id="result-box" class="result-box hidden">

            <p class="eyebrow">QUIZ COMPLETE</p>

            <h2 id="result-title">
                You finished!
            </h2>

            <div class="final-score">
                <span id="final-score">0</span>
                <small>/ 10</small>
            </div>

            <p id="result-message">
                Nice!
            </p>

            <button id="restart-button">
                Play Again
            </button>

        </div>

    </main>


    <script src="quiz.js"></script>

</body>
</html>
